<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src data:; img-src data:; form-action 'none';">
    <title>Schedules</title>
    <style>
        :root {
            --bg-page: #121212;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --card-bg: rgba(255, 255, 255, 0.025);
            --card-border: rgba(255, 255, 255, 0.08);
            --row-border: rgba(255, 255, 255, 0.05);
            --accent-blue: #2563eb;
            --accent-blue-hover: #1d4ed8;
            --pill-active-bg: rgba(255, 255, 255, 0.08);
            --pill-active-border: rgba(255, 255, 255, 0.12);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 36px 44px 60px 44px;
            -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 960px; margin: 0 auto; }
        .breadcrumb {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .breadcrumb span.current { color: var(--text-primary); font-weight: 500; }
        h1 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.015em;
            color: var(--text-primary);
            margin-bottom: 6px;
        }
        p.subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 12px;
        }
        .pills {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .pill {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid transparent;
            border-radius: 9999px;
            padding: 5px 14px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .pill:hover { color: var(--text-primary); background: rgba(255, 255, 255, 0.04); }
        .pill.active {
            background: var(--pill-active-bg);
            color: var(--text-primary);
            border-color: var(--pill-active-border);
        }
        .btn-primary {
            background: #ffffff;
            color: #111827;
            border: none;
            border-radius: 6px;
            padding: 7px 14px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.15s ease;
        }
        .btn-primary:hover { background: #e5e7eb; }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-primary);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }
        .callout {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-left: 3px solid #3b82f6;
            border-radius: 8px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            gap: 16px;
        }
        .callout-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .callout-icon {
            color: #60a5fa;
            font-size: 18px;
            display: flex;
            align-items: center;
        }
        .callout-title {
            font-size: 13.5px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 2px;
        }
        .callout-desc {
            font-size: 12.5px;
            color: var(--text-secondary);
        }
        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
            margin-top: 28px;
        }
        .card-group {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .card-row {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--row-border);
            gap: 16px;
        }
        .card-row:last-child { border-bottom: none; }
        .card-row-info { flex: 1; }
        .card-row-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-row-desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.45;
        }
        .badge {
            font-size: 11px;
            font-weight: 500;
            padding: 2px 7px;
            border-radius: 4px;
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.25);
        }
        .badge-green {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.25);
        }
        .badge-neutral {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .empty-state {
            padding: 36px 20px;
            text-align: center;
            color: var(--text-muted);
        }
        .empty-icon { font-size: 28px; margin-bottom: 8px; opacity: 0.6; }
        .empty-text { font-size: 13.5px; color: var(--text-secondary); margin-bottom: 4px; }
        .empty-subtext { font-size: 12.5px; color: var(--text-muted); }
        code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 6px;
            border-radius: 4px;
            color: #e5e7eb;
        }

        [hidden] { display: none !important; }
        select, input, button { font: inherit; }
        select, input { color: var(--vscode-input-foreground, inherit); background: var(--vscode-input-background, transparent); border: 1px solid var(--vscode-input-border, #555); padding: 8px; border-radius: 4px; }
        label { display: inline-flex; gap: 8px; align-items: center; margin: 8px 12px 8px 0; }
        #status { margin: 16px 0; white-space: pre-wrap; }
        .card-row { overflow-wrap: anywhere; }
        .card-row pre { white-space: pre-wrap; margin: 8px 0; }
        button:disabled { opacity: 0.5; cursor: default; }
    </style>
</head>
<body>
    <main class="container">
        <div class="breadcrumb"><span>Autonom</span><span>/</span><span class="current">Schedules</span></div>
        <h1>Schedules</h1>
        <p class="subtitle">Create and cancel schedules for profile inboxes.</p>
        <label>Profile <select id="profile" disabled onchange="refresh()"><option value="human">human</option></select></label>
        <button class="btn-secondary" onclick="refresh()">Refresh</button>
        <button class="btn-secondary" onclick="refreshClock()">Check due schedules</button>
        <form id="create" onsubmit="createSchedule(event)">
            <label>Type <select id="type" onchange="selectType()"><option>clock</option><option>ping</option><option>dm</option><option>room</option></select></label>
            <label id="room-field" hidden>Room <input id="room"></label>
            <label id="from-field" hidden>From profile (optional) <input id="from"></label>
            <span id="clock-fields">
                <label>At <input id="at" type="datetime-local"></label>
                <label>Or every seconds <input id="every" type="number" min="1" max="2592000"></label>
            </span>
            <button id="add" class="btn-primary" disabled>Create schedule</button>
        </form>
        <p id="status" role="status">Loading…</p>
        <div id="records" class="card-group"></div>
    </main>
    <script>
        const vscode = typeof acquireVsCodeApi === "function" ? acquireVsCodeApi() : null;
        const pending = new Map();
        let serial = 0;

        function request(action, values = {})
        {
            return new Promise((resolve, reject) =>
            {
                if (!vscode)
                    return reject(new Error("Open this page in the Autonom Command Center."));
                const reqId = String(++serial);
                const timer = setTimeout(() =>
                {
                    pending.delete(reqId);
                    reject(new Error("The request timed out. Refresh to retry."));
                }, 30000);
                pending.set(reqId, { resolve, reject, timer });
                vscode.postMessage({ ...values, action, reqId });
            });
        }

        window.addEventListener("message", (event) =>
        {
            const data = event.data || {};
            const call = pending.get(data.reqId);
            if (!call)
                return;
            pending.delete(data.reqId);
            clearTimeout(call.timer);
            if (data.error)
                call.reject(new Error(data.error));
            else
                call.resolve(data.result);
        });

        function showError(error)
        {
            document.getElementById("status").textContent = error.message;
        }

        let revision = 0;

        function selectType()
        {
            const type = document.getElementById("type").value;
            document.getElementById("room-field").hidden = type !== "room";
            document.getElementById("from-field").hidden = type === "clock";
            document.getElementById("clock-fields").hidden = type !== "clock";
        }

        async function refresh()
        {
            const current = ++revision;
            document.getElementById("status").textContent = "Loading…";
            try
            {
                const profile = document.getElementById("profile").value;
                const schedules = await request("getSchedules", { profile });
                if (current !== revision)
                    return;
                const records = document.getElementById("records");
                records.replaceChildren();
                for (const schedule of schedules)
                {
                    const row = document.createElement("div");
                    row.className = "card-row";
                    const details = document.createElement("pre");
                    const title = schedule.type + (schedule.room ? ` in ${schedule.room}` : "") + (schedule.from ? ` from ${schedule.from}` : "");
                    const clock = schedule.every ? `Every ${schedule.every} seconds` : schedule.at ? `At ${new Date(schedule.at).toLocaleString()}` : "On matching activity";
                    const next = schedule.type === "clock" ? `\nNext: ${new Date(schedule.next - 62135596800000).toLocaleString()}` : "";
                    details.textContent = `${title}\n${clock}${next}`;
                    const cancel = document.createElement("button");
                    cancel.className = "btn-secondary";
                    cancel.textContent = "Cancel";
                    cancel.onclick = async () =>
                    {
                        cancel.disabled = true;
                        try
                        {
                            await request("removeSchedule", { profile, id: schedule.id });
                            await refresh();
                        }
                        catch (error)
                        {
                            showError(error);
                            cancel.disabled = false;
                        }
                    };
                    row.append(details, cancel);
                    records.append(row);
                }
                document.getElementById("status").textContent = schedules.length ? `${schedules.length} schedules.` : "No active schedules.";
                document.getElementById("add").disabled = false;
            }
            catch (error)
            {
                if (current === revision)
                {
                    document.getElementById("records").replaceChildren();
                    document.getElementById("add").disabled = true;
                    showError(error);
                }
            }
        }

        async function createSchedule(event)
        {
            event.preventDefault();
            const add = document.getElementById("add");
            add.disabled = true;
            try
            {
                const schedule = { type: document.getElementById("type").value };
                if (schedule.type === "clock")
                {
                    const at = document.getElementById("at").value;
                    const every = document.getElementById("every").value;
                    if (!!at === !!every)
                        throw new Error("Choose either a time or an interval.");
                    if (at)
                        schedule.at = new Date(at).toISOString();
                    else
                        schedule.every = Number(every);
                }
                else
                {
                    const from = document.getElementById("from").value.trim();
                    if (from)
                        schedule.from = from;
                    if (schedule.type === "room")
                        schedule.room = document.getElementById("room").value.trim();
                }
                await request("createSchedule", { profile: document.getElementById("profile").value, schedule });
                await refresh();
            }
            catch (error)
            {
                showError(error);
            }
            finally
            {
                add.disabled = false;
            }
        }

        async function refreshClock()
        {
            try
            {
                await request("refreshSchedules");
                await refresh();
            }
            catch (error)
            {
                showError(error);
            }
        }

        async function loadProfiles()
        {
            const profiles = await request("getProfiles");
            const select = document.getElementById("profile");
            for (const profile of profiles)
                select.add(new Option(profile.name, profile.name));
            select.disabled = false;
            await refresh();
        }

        loadProfiles().catch(showError);

    </script>
</body>
</html>
