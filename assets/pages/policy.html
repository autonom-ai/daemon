<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src data:; img-src data:; form-action 'none';">
    <title>Policy</title>
    <style>
        :root {
            --bg-page: #121212;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --card-bg: rgba(255, 255, 255, 0.025);
            --card-border: rgba(255, 255, 255, 0.08);
            --row-border: rgba(255, 255, 255, 0.05);
            --accent-emerald: #10b981;
            --pill-active-bg: rgba(255, 255, 255, 0.08);
            --pill-active-border: rgba(255, 255, 255, 0.12);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 36px 44px 60px 44px;
            -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 960px; margin: 0 auto; }
        .breadcrumb {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .breadcrumb span.current { color: var(--text-primary); font-weight: 500; }
        h1 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.015em;
            color: var(--text-primary);
            margin-bottom: 6px;
        }
        p.subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 12px;
        }
        .pills {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .pill {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid transparent;
            border-radius: 9999px;
            padding: 5px 14px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .pill:hover { color: var(--text-primary); background: rgba(255, 255, 255, 0.04); }
        .pill.active {
            background: var(--pill-active-bg);
            color: var(--text-primary);
            border-color: var(--pill-active-border);
        }
        .btn-primary {
            background: #ffffff;
            color: #111827;
            border: none;
            border-radius: 6px;
            padding: 7px 14px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.15s ease;
        }
        .btn-primary:hover { background: #e5e7eb; }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-primary);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }
        .callout {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-left: 3px solid #10b981;
            border-radius: 8px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            gap: 16px;
        }
        .callout-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .callout-icon {
            color: #34d399;
            font-size: 18px;
            display: flex;
            align-items: center;
        }
        .callout-title {
            font-size: 13.5px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 2px;
        }
        .callout-desc {
            font-size: 12.5px;
            color: var(--text-secondary);
        }
        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
            margin-top: 28px;
        }
        .card-group {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .card-row {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--row-border);
            gap: 16px;
        }
        .card-row:last-child { border-bottom: none; }
        .card-row-info { flex: 1; }
        .card-row-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-row-desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.45;
        }
        .badge {
            font-size: 11px;
            font-weight: 500;
            padding: 2px 7px;
            border-radius: 4px;
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.25);
        }
        .badge-green {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.25);
        }
        .badge-red {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.25);
        }
        .badge-neutral {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 6px;
            border-radius: 4px;
            color: #e5e7eb;
        }

        select, input, button { font: inherit; }
        select, input { color: var(--vscode-input-foreground, inherit); background: var(--vscode-input-background, transparent); border: 1px solid var(--vscode-input-border, #555); padding: 8px; border-radius: 4px; }
        label { display: inline-flex; gap: 8px; align-items: center; margin: 8px 12px 8px 0; }
        #status { margin: 16px 0; white-space: pre-wrap; }
        .card-row { overflow-wrap: anywhere; }
        .card-row pre { white-space: pre-wrap; margin: 8px 0; }
        button:disabled { opacity: 0.5; cursor: default; }
    </style>
</head>
<body>
    <main class="container">
        <div class="breadcrumb"><span>Autonom</span><span>/</span><span class="current">Workspace Policy</span></div>
        <h1>Workspace Policy</h1>
        <p class="subtitle">Rules are evaluated in file order. The first match wins; unmatched calls are denied.</p>
        <button class="btn-secondary" onclick="refresh()">Reload and validate</button>
        <button class="btn-primary" onclick="request('editPolicy').catch(showError)">Edit policy.yml</button>
        <p id="status" role="status">Loading…</p>
        <div id="records" class="card-group"></div>
    </main>
    <script>
        const vscode = typeof acquireVsCodeApi === "function" ? acquireVsCodeApi() : null;
        const pending = new Map();
        let serial = 0;

        function request(action, values = {})
        {
            return new Promise((resolve, reject) =>
            {
                if (!vscode)
                    return reject(new Error("Open this page in the Autonom Command Center."));
                const reqId = String(++serial);
                const timer = setTimeout(() =>
                {
                    pending.delete(reqId);
                    reject(new Error("The request timed out. Refresh to retry."));
                }, 30000);
                pending.set(reqId, { resolve, reject, timer });
                vscode.postMessage({ ...values, action, reqId });
            });
        }

        window.addEventListener("message", (event) =>
        {
            const data = event.data || {};
            const call = pending.get(data.reqId);
            if (!call)
                return;
            pending.delete(data.reqId);
            clearTimeout(call.timer);
            if (data.error)
                call.reject(new Error(data.error));
            else
                call.resolve(data.result);
        });

        function showError(error)
        {
            document.getElementById("status").textContent = error.message;
        }

        let revision = 0;

        async function refresh()
        {
            const current = ++revision;
            document.getElementById("status").textContent = "Loading…";
            try
            {
                const rules = await request("getPolicy");
                if (current !== revision)
                    return;
                const records = document.getElementById("records");
                records.replaceChildren();
                for (const [index, rule] of rules.entries())
                {
                    const row = document.createElement("div");
                    row.className = "card-row";
                    const details = document.createElement("pre");
                    details.textContent = `${index + 1}. ${rule.action}\n${JSON.stringify(rule, null, 2)}`;
                    row.append(details);
                    records.append(row);
                }
                document.getElementById("status").textContent = `${rules.length} valid rules loaded. Reloading does not call screening models.`;
            }
            catch (error)
            {
                if (current === revision)
                {
                    document.getElementById("records").replaceChildren();
                    showError(error);
                }
            }
        }

        refresh();

    </script>
</body>
</html>
