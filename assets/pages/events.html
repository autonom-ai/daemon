<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src data:; img-src data:; form-action 'none';">
    <title>Events</title>
    <style>
        :root {
            --bg-page: #121212;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --text-muted: #6b7280;
            --card-bg: rgba(255, 255, 255, 0.025);
            --card-border: rgba(255, 255, 255, 0.08);
            --row-border: rgba(255, 255, 255, 0.05);
            --accent-purple: #8b5cf6;
            --pill-active-bg: rgba(255, 255, 255, 0.08);
            --pill-active-border: rgba(255, 255, 255, 0.12);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 36px 44px 60px 44px;
            -webkit-font-smoothing: antialiased;
        }
        .container { max-width: 960px; margin: 0 auto; }
        .breadcrumb {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .breadcrumb span.current { color: var(--text-primary); font-weight: 500; }
        h1 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.015em;
            color: var(--text-primary);
            margin-bottom: 6px;
        }
        p.subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 12px;
        }
        .pills {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .pill {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid transparent;
            border-radius: 9999px;
            padding: 5px 14px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .pill:hover { color: var(--text-primary); background: rgba(255, 255, 255, 0.04); }
        .pill.active {
            background: var(--pill-active-bg);
            color: var(--text-primary);
            border-color: var(--pill-active-border);
        }
        .btn-primary {
            background: #ffffff;
            color: #111827;
            border: none;
            border-radius: 6px;
            padding: 7px 14px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.15s ease;
        }
        .btn-primary:hover { background: #e5e7eb; }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-primary);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); }
        .callout {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-left: 3px solid #8b5cf6;
            border-radius: 8px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            gap: 16px;
        }
        .callout-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .callout-icon {
            color: #a78bfa;
            font-size: 18px;
            display: flex;
            align-items: center;
        }
        .callout-title {
            font-size: 13.5px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 2px;
        }
        .callout-desc {
            font-size: 12.5px;
            color: var(--text-secondary);
        }
        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
            margin-top: 28px;
        }
        .card-group {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .card-row {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--row-border);
            gap: 16px;
        }
        .card-row:last-child { border-bottom: none; }
        .card-row-info { flex: 1; }
        .card-row-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-row-desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.45;
        }
        .badge {
            font-size: 11px;
            font-weight: 500;
            padding: 2px 7px;
            border-radius: 4px;
            background: rgba(139, 92, 246, 0.15);
            color: #a78bfa;
            border: 1px solid rgba(139, 92, 246, 0.25);
        }
        .badge-green {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.25);
        }
        .badge-neutral {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .empty-state {
            padding: 36px 20px;
            text-align: center;
            color: var(--text-muted);
        }
        .empty-icon { font-size: 28px; margin-bottom: 8px; opacity: 0.6; }
        .empty-text { font-size: 13.5px; color: var(--text-secondary); margin-bottom: 4px; }
        .empty-subtext { font-size: 12.5px; color: var(--text-muted); }
        code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 6px;
            border-radius: 4px;
            color: #e5e7eb;
        }

        [hidden] { display: none !important; }
        select, input, button { font: inherit; }
        select, input { color: var(--vscode-input-foreground, inherit); background: var(--vscode-input-background, transparent); border: 1px solid var(--vscode-input-border, #555); padding: 8px; border-radius: 4px; }
        label { display: inline-flex; gap: 8px; align-items: center; margin: 8px 12px 8px 0; }
        #status { margin: 16px 0; white-space: pre-wrap; }
        .card-row { overflow-wrap: anywhere; }
        .card-row pre { white-space: pre-wrap; margin: 8px 0; }
        button:disabled { opacity: 0.5; cursor: default; }
    </style>
</head>
<body>
    <main class="container">
        <div class="breadcrumb"><span>Autonom</span><span>/</span><span class="current">Events</span></div>
        <h1>Events</h1>
        <p class="subtitle">Pending events for each profile. Viewing an inbox leaves its events unread.</p>
        <label>Profile <select id="profile" disabled onchange="refresh()"><option value="human">human</option></select></label>
        <label>Type <select id="filter" onchange="render()"><option value="">All</option><option>ping</option><option>dm</option><option>room</option><option>clock</option></select></label>
        <button class="btn-secondary" onclick="refresh()">Refresh</button>
        <button id="acknowledge" class="btn-primary" disabled onclick="acknowledge()">Acknowledge pending events</button>
        <p id="status" role="status">Loading…</p>
        <div id="records" class="card-group"></div>
    </main>
    <script>
        const vscode = typeof acquireVsCodeApi === "function" ? acquireVsCodeApi() : null;
        const pending = new Map();
        let serial = 0;

        function request(action, values = {})
        {
            return new Promise((resolve, reject) =>
            {
                if (!vscode)
                    return reject(new Error("Open this page in the Autonom Command Center."));
                const reqId = String(++serial);
                const timer = setTimeout(() =>
                {
                    pending.delete(reqId);
                    reject(new Error("The request timed out. Refresh to retry."));
                }, 30000);
                pending.set(reqId, { resolve, reject, timer });
                vscode.postMessage({ ...values, action, reqId });
            });
        }

        window.addEventListener("message", (event) =>
        {
            const data = event.data || {};
            const call = pending.get(data.reqId);
            if (!call)
                return;
            pending.delete(data.reqId);
            clearTimeout(call.timer);
            if (data.error)
                call.reject(new Error(data.error));
            else
                call.resolve(data.result);
        });

        function showError(error)
        {
            document.getElementById("status").textContent = error.message;
        }

        let events = [];
        let revision = 0;

        async function refresh()
        {
            const current = ++revision;
            document.getElementById("acknowledge").disabled = true;
            document.getElementById("status").textContent = "Loading…";
            try
            {
                const result = await request("getEvents", { profile: document.getElementById("profile").value });
                if (current !== revision)
                    return;
                events = result;
                render();
            }
            catch (error)
            {
                if (current === revision)
                {
                    document.getElementById("records").replaceChildren();
                    showError(error);
                }
            }
        }

        function render()
        {
            const filter = document.getElementById("filter").value;
            const records = document.getElementById("records");
            records.replaceChildren();
            for (const event of events.filter((entry) => !filter || entry.type === filter))
            {
                const row = document.createElement("div");
                row.className = "card-row";
                const details = document.createElement("pre");
                const title = event.type + (event.from ? ` from ${event.from}` : "") + (event.room ? ` in ${event.room}` : "");
                const time = new Date(event.ts - 62135596800000).toLocaleString();
                details.textContent = `${title} · ${time}\n${event.text || "Scheduled wake"}`;
                row.append(details);
                records.append(row);
            }
            document.getElementById("status").textContent = events.length ? `${events.length} pending events.` : "No pending events.";
            document.getElementById("acknowledge").disabled = !events.length;
        }

        async function acknowledge()
        {
            document.getElementById("acknowledge").disabled = true;
            try
            {
                await request("acknowledgeEvents", { profile: document.getElementById("profile").value });
                await refresh();
            }
            catch (error)
            {
                showError(error);
                document.getElementById("acknowledge").disabled = false;
            }
        }

        async function loadProfiles()
        {
            const profiles = await request("getProfiles");
            const select = document.getElementById("profile");
            for (const profile of profiles)
                select.add(new Option(profile.name, profile.name));
            select.disabled = false;
            await refresh();
        }

        loadProfiles().catch(showError);

    </script>
</body>
</html>
