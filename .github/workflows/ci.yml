name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Every JS file parses — catches missing imports and syntax slips,
      # the failure class this codebase actually produces.
      - name: Syntax-check all JS
        run: |
          find . -name node_modules -prune -o -name '*.mjs' -print -o -name '*.js' -print | while read -r f; do
            node --check "$f" || exit 1
          done
          node --check bin/coord

      # The extension host's bus client is plain Node (no vscode import), so the
      # product contract — a wired workspace's room reads and writes its bus —
      # is testable here without an editor.
      - name: Smoke-test the room bus client
        run: |
          npm ci --ignore-scripts
          WS=/tmp/ci-room
          mkdir -p "$WS/.devin"
          printf '{"project":"ci-room","human":"ci","teamRoom":"general","roster":[],"coordRoot":"%s"}\n' "$PWD" > "$WS/.devin/coord.json"
          node -e '
            const { openBus } = require("./source/extension/bus.js");
            (async () => {
              const bus = await openBus({ projectDir: "/tmp/ci-room", coordRoot: process.cwd() });
              const before = await bus.state();
              if (!before.rooms.some((room) => room.name === "general")) throw new Error("no #general");
              await bus.say("general", "hello from CI", "chatter");
              const after = await bus.state();
              const last = after.messages[after.messages.length - 1];
              if (last?.text !== "hello from CI") throw new Error("say did not land");
              console.log("bus ok:", after.messages.length, "message(s)");
            })().catch((err) => { console.error(err); process.exit(1); });
          '

      # Hooks are the other half of the product — session-start must emit
      # valid hook JSON even with a brand-new identity.
      - name: Smoke-test session-start hook (no identity)
        run: |
          WS=/tmp/ci-hooks
          mkdir -p "$WS/.devin"
          printf '{"session_id":"ci-none"}' | DEVIN_PROJECT_DIR="$WS" node source/devin/hooks/session-start.mjs \
            | grep -q hookSpecificOutput

      # Identity regressions this must catch: session-start crashing when a
      # claim resolves (the 2026-09-20 `detected` ReferenceError shipped because
      # the empty-roster test never reached that branch), and record-join
      # writing a claim for a join the bus refused.
      - name: Smoke-test identity hooks
        run: |
          WS=/tmp/ci-hooks
          mkdir -p "$WS/.devin/agent-coord/claims" agents/testy
          printf -- '---\nname: testy\ndisplayName: Testy\n---\n\nTest persona.\n' > agents/testy/identity.md
          printf '{"agentId":"testy","claimedAt":%s}\n' "$(date +%s000)" > "$WS/.devin/agent-coord/claims/ci-session.json"
          printf '{"session_id":"ci-session"}' | DEVIN_PROJECT_DIR="$WS" node source/devin/hooks/session-start.mjs \
            | grep -q 'You are Testy'
          printf '{"session_id":"ci-join","tool_name":"mcp__agent-coord-testy__join","tool_input":{"agentId":"testy"},"tool_response":{"success":true}}' \
            | DEVIN_PROJECT_DIR="$WS" node source/devin/hooks/record-join.mjs
          grep -q '"agentId": "testy"' "$WS/.devin/agent-coord/claims/ci-join.json"
          printf '{"session_id":"ci-refused","tool_name":"mcp__agent-coord-testy__join","tool_input":{"agentId":"testy"},"tool_response":{"success":false}}' \
            | DEVIN_PROJECT_DIR="$WS" node source/devin/hooks/record-join.mjs
          test ! -e "$WS/.devin/agent-coord/claims/ci-refused.json"

      - name: Smoke-test per-agent tool log
        run: |
          WS=/tmp/ci-hooks
          PROFILE=agents/testy/tool-calls.jsonl
          printf '{"ts":1,"tool":"old"}\n' > "$PROFILE"
          printf '{"session_id":"ci-unjoined","tool_name":"exec","tool_input":{"command":"git status"}}' \
            | DEVIN_PROJECT_DIR="$WS" node source/devin/hooks/tool-log.mjs
          test ! -e "$WS/.devin/agent-coord/state/tool-calls-anon.jsonl"
          printf '{"session_id":"ci-session","tool_name":"exec","tool_input":{"command":"git status"}}' \
            | DEVIN_PROJECT_DIR="$WS" node source/devin/hooks/tool-log.mjs
          test "$(wc -l < "$PROFILE")" -eq 1
          grep -q '"tool":"exec"' "$PROFILE"
