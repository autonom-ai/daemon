name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest
      - name: Build the command
        run: dub build --compiler=ldc2 --config=daemon
      - name: Run unit tests
        run: dub run --compiler=ldc2 --config=unit --build=unittest
      - name: Run MCP tests
        run: python3 source/mcp/tests.py
      - name: Run command tests
        run: python3 tests/command.py
      - name: Run installer tests
        run: python3 tests/install.py
