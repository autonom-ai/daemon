name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest
      - name: Build library
        run: dub build --compiler=ldc2 --config=library
      - name: Run unit tests
        run: dub run --compiler=ldc2 --config=unit --build=unittest
      - name: Build eval runner
        run: dub build --compiler=ldc2 --config=eval
      - name: Build daemon
        run: dub build --compiler=ldc2 --config=daemon
      - name: Build Serverino test host
        run: dub build --compiler=ldc2 --config=http-test
