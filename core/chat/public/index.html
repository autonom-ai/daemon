<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>team room</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="banner standdown" id="standdown-banner" hidden>
  Stand-down is active: seats may end their turns. Press <em>resume</em> when you want them back in the loop.
</div>

<div class="banner recess" id="recess-banner" hidden>
  <strong>Recess open</strong> — the team has stopped building and is talking in #general.
  <span id="recess-when"></span>
  <button id="recess-end" type="button">close the recess</button>
</div>

<div class="toast" id="toast" hidden></div>

<main>
  <aside>
    <section class="controls">
      <button id="recess" class="recess" title="Stop the team and hold a recess: they announce themselves in #general and discuss">call recess</button>
      <button id="standdown" class="danger" title="Release the never-end stop hook so seats can close their turns">stand down</button>
    </section>
    <section>
      <h2>Rooms</h2>
      <ul id="rooms" class="rooms"></ul>
    </section>
    <section>
      <h2>Direct</h2>
      <ul id="dms" class="dms"></ul>
    </section>
    <footer class="status-bar">
      <span class="conn" id="conn">connecting…</span>
      <span class="build" id="build" title="which build this server is running"></span>
    </footer>
  </aside>

  <section class="chat">
    <div class="toolbar">
      <button type="button" id="menu" title="rooms and direct messages" aria-label="toggle sidebar">☰</button>
      <input id="search" type="search" placeholder="search messages">
      <label><input type="checkbox" id="autoscroll" checked> follow</label>
      <span class="count" id="count"></span>
    </div>

    <ol id="messages" class="messages"></ol>

    <form id="composer" class="composer">
      <div class="compose-mode" id="compose-mode"></div>
      <div class="composer-input">
        <textarea id="text" rows="3" placeholder="Speak to the team — enter sends, shift+enter for a newline. Type @ to ping a seat."></textarea>
        <ul id="mentions" class="mentions" hidden></ul>
      </div>
      <div class="composer-row">
        <select id="kind" title="message kind">
          <option value="chatter">chatter</option>
          <option value="status">status</option>
          <option value="decision">decision</option>
        </select>
        <button type="submit" class="primary">send</button>
        <span class="hint" id="hint"></span>
      </div>
    </form>
  </section>
</main>

<dialog id="recess-dialog" class="dialog">
  <h2 id="recess-dialog-title">call recess</h2>
  <p class="dialog-lede" id="recess-dialog-lede"></p>
  <textarea id="recess-note" rows="3"></textarea>
  <div class="dialog-actions">
    <button type="button" id="recess-cancel">cancel</button>
    <button type="button" id="recess-confirm">call recess</button>
  </div>
</dialog>

<script src="/app.js"></script>
</body>
</html>
