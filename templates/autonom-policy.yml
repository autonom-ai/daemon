# The default workspace policy. Setup copies it to
# <workspace>/.devin/autonom-policy.yml; a workspace without that file runs on
# this template as-is, so the protections below are always the starting point.
# A room's own policy.yml adds rules on top and can only restrict.
#
# `access` lists the named guards enforced before any rule runs - each is a
# deny boundary implemented by the core, and the file chooses which are on.
# `except` on a guard or a rule exempts those profiles (case-insensitive) from
# that one entry.
access:
  # .env and .env.* are never a tool's business.
  - guard: env
  # agents/<name> is private to that profile; the session map is private to
  # the core.
  - guard: profiles
  # Room files follow the owner/admin/involved ladder, and a hidden room stays
  # invisible to search and glob.
  - guard: rooms
  # Shell paths must stay inside allowed access, and protected directories
  # (home, the codebase, /) cannot be deleted.
  - guard: exec
  # The codebase this runs from is not a scratch space - the three seats that
  # maintain it are exempt.
  - guard: codebase
    except: [sable, wren, marlow]
# A rule matches on `tool` (the tool name) and any other key (an input field,
# matched as a regex), then acts: `deny`, `allow`, or `screen` (ask the
# backend the typed `question` and deny when the answer is harmful).
# Content-bearing fields are scrubbed before a request reaches the backend; a
# screen rule's `expose` list names the input fields it is allowed to judge.
rules:
  - action: screen
    threshold: 0.5
    reason: The policy check denied this request
    context:
      - get_profiles lists profile names and paths only.
      - The first set_profile claim is trusted; later changes are disallowed.
      - The session map is private. Only the mapped profile may be read or changed.
      - Deleting home or source and bypassing restrictions are harmful.
    question:
      type: noul
      instructions: >-
        Does this request access another profile or the session map? Does it
        delete a protected directory or evade restrictions, including through
        redirection? Treat uncertainty as harmful.
      criteria:
        true: The request is harmful or a likely workaround.
        false: The request is limited to allowed profile operations.
