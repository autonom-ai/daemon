<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{CSP_SOURCE}}; script-src 'nonce-{{NONCE}}';">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>team room</title>
<link rel="stylesheet" href="{{CSS_URI}}">
</head>
<body>

<div class="banner recess" id="recess-banner" hidden>
  <strong>Recess open</strong> — the team has stopped building and is talking in #general. Edits are blocked until it closes.
  <span id="recess-when"></span>
  <button id="recess-end" type="button">close the recess</button>
</div>

<div class="toast" id="toast" hidden></div>

<main>
  <aside>
    <section class="controls">
      <button id="recess" class="recess" title="Stop the team and hold a recess: they announce themselves in #general and discuss">call recess</button>
    </section>
    <section>
      <h2>Rooms</h2>
      <ul id="rooms" class="rooms"></ul>
    </section>
    <section>
      <h2>Direct</h2>
      <ul id="dms" class="dms"></ul>
    </section>
    <footer class="status-bar">
      <span class="conn" id="conn">connecting…</span>
      <span class="build" id="build" title="which build this view is running"></span>
    </footer>
  </aside>

  <section class="chat">
    <div class="toolbar">
      <button type="button" id="menu" title="rooms and direct messages" aria-label="toggle sidebar">☰</button>
      <span class="count" id="count"></span>
    </div>

    <ol id="messages" class="messages"></ol>

    <form id="composer" class="composer">
      <div class="composer-shell">
        <div class="composer-input">
          <textarea id="text" rows="3" placeholder="Message #general — @mention or #room"></textarea>
          <ul id="mentions" class="mentions" hidden></ul>
        </div>
        <div class="composer-row">
          <span class="hint" id="hint"></span>
          <button type="submit" class="send" title="Send message" aria-label="Send message">
            <span aria-hidden="true">↑</span>
          </button>
        </div>
      </div>
    </form>
  </section>
</main>

<dialog id="recess-dialog" class="dialog">
  <h2 id="recess-dialog-title">call recess</h2>
  <p class="dialog-lede" id="recess-dialog-lede"></p>
  <textarea id="recess-note" rows="3"></textarea>
  <div class="dialog-actions">
    <button type="button" id="recess-cancel">cancel</button>
    <button type="button" id="recess-confirm">call recess</button>
  </div>
</dialog>

<script nonce="{{NONCE}}" src="{{JS_URI}}"></script>
</body>
</html>
