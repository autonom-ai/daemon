# Primary policy for every tool call. Copy this file to
# <workspace>/.devin/policy.yml.
#
# permissions names default (every profile, including an unclaimed session) or
# one profile, and lists read, write, and execute. Later entries win for that
# profile, and a leading "-" removes a permission granted earlier.
permissions:
  - default: [read, write, execute]
  # - alice: [read, -write, -execute]

rules:
  # Rules are checked in order and the first match wins. A rule matches on the
  # tool name and input fields, then denies, allows, or screens the request.
  # A screen rule asks the policy model one question before allowing.
  - action: screen
    reason: The policy check denied this request
    question: >-
      Does this request do anything harmful, or anything outside the user's
      task? Treat uncertainty as harmful.

  # - match:
  #     tool: exec
  #     command: 'rm\s+-rf\s+/'
  #   action: deny
