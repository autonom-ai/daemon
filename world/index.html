<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>autonom world</title>
<style>
  body { margin: 0; background: #0d1117; display: flex; flex-direction: column; align-items: center; font-family: monospace; }
  h1 { color: #58a6ff; font-size: 16px; font-weight: normal; margin: 10px 0 4px; }
  #sub { color: #8b949e; font-size: 11px; margin-bottom: 8px; }
  canvas { border: 1px solid #30363d; border-radius: 8px; }
</style>
</head>
<body>
<h1>autonom world</h1>
<div id="sub"></div>
<canvas id="c" width="800" height="600"></canvas>
<script>
const cv = document.getElementById('c');
const cx = cv.getContext('2d');
const sub = document.getElementById('sub');

async function tick() {
  try {
    const w = await (await fetch('world.json?ts=' + Date.now())).json();
    cx.clearRect(0, 0, 800, 600);
    const circles = Object.entries(w.circles || {});
    sub.textContent = circles.length + ' in the arena · ' + new Date().toLocaleTimeString();
    for (const [name, c] of circles) {
      cx.beginPath();
      cx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
      cx.fillStyle = c.color || '#58a6ff';
      cx.globalAlpha = 0.85;
      cx.fill();
      cx.globalAlpha = 1;
      // name
      cx.fillStyle = '#e6edf3';
      cx.font = '11px monospace';
      cx.textAlign = 'center';
      cx.fillText(name, c.x, c.y + c.r + 14);
      // velocity vector
      if (Math.hypot(c.vx, c.vy) > 5) {
        cx.beginPath();
        cx.moveTo(c.x, c.y);
        cx.lineTo(c.x + c.vx * 0.15, c.y + c.vy * 0.15);
        cx.strokeStyle = '#8b949e';
        cx.stroke();
      }
      // speech bubble
      if (c.bubble) {
        cx.font = '12px monospace';
        const tw = cx.measureText(c.bubble).width;
        const bx = Math.min(Math.max(c.x, tw / 2 + 8), 800 - tw / 2 - 8);
        const by = c.y - c.r - 26;
        cx.fillStyle = '#161b22';
        cx.strokeStyle = '#30363d';
        cx.beginPath();
        cx.roundRect(bx - tw / 2 - 7, by - 15, tw + 14, 21, 6);
        cx.fill();
        cx.stroke();
        cx.fillStyle = '#e6edf3';
        cx.fillText(c.bubble, bx, by);
      }
    }
  } catch (e) { sub.textContent = 'world.json unreadable: ' + e.message; }
}
tick();
setInterval(tick, 100);
</script>
</body>
</html>
